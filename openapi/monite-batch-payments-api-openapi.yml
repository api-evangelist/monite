      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    PaymentsBatchPaymentRequest:
      properties:
        payer_bank_account_id:
          type: string
          format: uuid
        payment_intents:
          items:
            $ref: '#/components/schemas/SinglePaymentIntent'
          type: array
          minItems: 1
        payment_method:
          type: string
          enum:
          - us_ach
      additionalProperties: false
      type: object

            format: color
          - type: 'null'
        primary_hover_color:
          anyOf:
          - type: string
            format: color
          - type: 'null'
        secondary_color:
          anyOf:
          - type: string
            format: color
          - type: 'null'
        secondary_hover_color:
          anyOf:
          - type: string
            format: color
          - type: 'null'
      type: object
    Unit:
      properties:
        designation:
          type: string
          minLength: 1
          examples:
          - kg
        name:
          type: string
          minLength: 1
          examples:
          - Kilogram
      type: object
      required:
      - designation
      - name
    PayableSettings:
      properties:
        allow_cancel_duplicates_automatically:

openapi: 3.2.0
info:
  title: Monite Delivery notes API
  contact:
    name: Monite team
    url: https://monite.com/about/
    email: developers@monite.com
  termsOfService: https://monite.com/terms
  version: '1.0'
  description: 'Operations tagged Delivery notes across 3 of this provider''s published API definitions: monite-openapi-2023-09-01.json, monite-openapi-2024-05-25.json, monite-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.dev.monite.com/v1
  description: Development environment
- url: https://api.sandbox.monite.com/v1
  description: Sandbox environment
- url: https://api.monite.com/v1
  description: Production environment (Europe)
- url: https://us.api.monite.com/v1
  description: Production environment (North America)
- url: https://api.monite.oaknorth.co.uk/v1
  description: Oak POC environment
tags:
- name: Delivery notes
paths:
  /delivery_notes:
    get:
      tags:
      - Delivery notes
      summary: Get delivery notes
      description: Get all delivery notes with filtering and pagination.
      operationId: get_delivery_notes
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - description: Sort order (ascending by default). Typically used together with the `sort` parameter.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/OrderEnum'
          default: asc
        name: order
        in: query
      - description: The number of items (0 .. 100) to return in a single page of the response. The response may contain fewer items if it is the last or only page.
        required: false
        schema:
          type: integer
          maximum: 100.0
          minimum: 1.0
          default: 100
        name: limit
        in: query
      - description: 'A pagination token obtained from a previous call to this endpoint. Use it to get the next or previous page of results for your initial query. If `pagination_token` is specified, all other query parameters are ignored and inferred from the initial query.


          If not specified, the first page of results will be returned.'
        required: false
        schema:
          type: string
        name: pagination_token
        in: query
      - description: The field to sort the results by. Typically used together with the `order` parameter.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/DeliveryNoteCursorFields'
        name: sort
        in: query
      - required: false
        schema:
          items:
            type: string
            format: uuid
          type: array
        name: id__in
        in: query
      - required: false
        schema:
          $ref: '#/components/schemas/DeliveryNoteStatusEnum'
        name: status
        in: query
      - required: false
        schema:
          items:
            $ref: '#/components/schemas/DeliveryNoteStatusEnum'
          type: array
        name: status__in
        in: query
      - required: false
        schema:
          type: string
          maxLength: 100
        name: document_id
        in: query
      - required: false
        schema:
          type: string
          maxLength: 100
        name: document_id__contains
        in: query
      - required: false
        schema:
          type: string
          maxLength: 100
        name: document_id__icontains
        in: query
      - required: false
        schema:
          type: string
          format: uuid
        name: created_by_entity_user_id
        in: query
      - required: false
        schema:
          type: string
          format: uuid
        name: counterpart_id
        in: query
      - required: false
        schema:
          type: string
          format: uuid
        name: based_on
        in: query
      - required: false
        schema:
          type: string
          maxLength: 100
        name: based_on_document_id
        in: query
      - required: false
        schema:
          type: string
          maxLength: 100
        name: based_on_document_id__contains
        in: query
      - required: false
        schema:
          type: string
          maxLength: 100
        name: based_on_document_id__icontains
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__gt
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__lt
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__gte
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__lte
        in: query
      - required: false
        schema:
          type: string
          format: date
        name: delivery_date__gt
        in: query
      - required: false

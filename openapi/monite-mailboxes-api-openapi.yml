components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    MailboxObjectTypeEnum:
      type: string
      enum:
      - payable
      - receipt
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    MailboxMultipleEntitiesRequest:
      properties:
        entity_ids:
          items:
            type: string
            format: uuid
          type: array
      additionalProperties: false
      type: object
      required:
      - entity_ids
    MailboxResponse:
      properties:
        id:
          type: string
          format: uuid
          description: Mailbox UUID
        mailbox_domain_id:
          type: string
          format: uuid
        mailbox_full_address:
          type: string
        mailbox_name:
          type: string
        related_object_type:
          type: string
        status:
          type: string
      type: object
      required:
      - id
      - mailbox_full_address
      - mailbox_name
      - related_object_type
      - status
    MailboxDomainRequest:
      properties:
        mailbox_domain_id:
          type: string
          format: uuid
        mailbox_name:
          type: string
        related_object_type:
          allOf:
          - $ref: '#/components/schemas/MailboxObjectTypeEnum'
          description: 'Related object type: payable and so on'
      additionalProperties: false
      type: object
      required:
      - mailbox_domain_id
      - mailbox_name
      - related_object_type
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    MailboxDataResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/MailboxResponse'
          type: array
      type: object
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

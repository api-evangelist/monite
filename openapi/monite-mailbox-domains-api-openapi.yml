      summary: Delete a mailbox domain
      description: Delete domain for the partner_id
      operationId: delete_mailbox_domains_id
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - required: true
        schema:
          type: string
          format: uuid
        name: domain_id
        in: path
      responses:

components:
  schemas:
    RoleResponse:
      properties:
        id:
          type: string
          format: uuid
          description: UUID role ID
        created_at:
          type: string
          format: date-time
          description: UTC datetime
        updated_at:
          type: string
          format: date-time
          description: UTC datetime
        name:
          type: string
          minLength: 1
          description: Role name
        permissions:
          $ref: '#/components/schemas/BizObjectsSchema-Output'
          description: Access permissions
        status:
          $ref: '#/components/schemas/StatusEnum'
          description: record status, 'active' by default
      type: object
      required:
      - id
      - name
      - permissions
      - status
      - created_at
      - updated_at
    BizObjectsSchema-Input:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/RootSchema-Input'
          type: array
          description: List of objects
      additionalProperties: false
      type: object
    PayableActionSchema:
      properties:
        action_name:
          $ref: '#/components/schemas/PayableActionEnum'
          description: Action name
          default: read
        permission:
          $ref: '#/components/schemas/PermissionEnum'
          description: Permission type
          default: allowed
      additionalProperties: false
      type: object
    RolePaginationResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/RoleResponse'
          type: array
          description: array of records
        next_pagination_token:
          anyOf:
          - type: string
          - type: 'null'
          description: A token that can be sent in the `pagination_token` query parameter to get the next page of results, or `null` if there is no next page (i.e. you've reached the last page).
        prev_pagination_token:
          anyOf:
          - type: string
          - type: 'null'
          description: A token that can be sent in the `pagination_token` query parameter to get the previous page of results, or `null` if there is no previous page (i.e. you've reached the first page).
      additionalProperties: false
      type: object
      required:
      - data
    PayableSchema-Input:
      properties:
        actions:
          items:
            $ref: '#/components/schemas/PayableActionSchema'
          type: array
          description: List of actions
        object_type:
          type: string
          const: payable
          description: Object type
          default: payable
      additionalProperties: false
      type: object
    ActionEnum:
      type: string
      enum:
      - create
      - read
      - update
      - delete
    PermissionEnum:
      type: string
      enum:
      - allowed
      - allowed_for_own
      - not_allowed
    RoleCursorFields:
      type: string
      enum:
      - updated_at
      - created_at
    CreateRoleRequest:
      properties:

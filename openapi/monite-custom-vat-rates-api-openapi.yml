components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    CustomVatRateResponse:
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          description: Time at which the Custom VAT rate was created. Timestamps follow the ISO 8601 standard.
        updated_at:
          type: string
          format: date-time
          description: Time at which the Custom VAT rate was last updated. Timestamps follow the ISO 8601 standard.
        components:
          items:
            $ref: '#/components/schemas/VatRateComponent'
          type: array
          maxItems: 10
          minItems: 1
          description: Sub-taxes included in the Custom VAT.
        created_by_entity_user_id:
          type: string
          format: uuid
          description: ID of the user that created the Custom VAT rate
        name:
          type: string
          maxLength: 64
          description: Display name of the Custom VAT.
        value:
          type: number
          description: 'Total sum of the Custom VAT rate including components. Percent multiplied by a 100. Example: 12.125% is 1212.5.'
      type: object
      required:
      - id
      - created_at
      - updated_at
      - components
      - name
      - value
    CustomVatRateRequest:
      properties:
        components:
          items:
            $ref: '#/components/schemas/VatRateComponent'
          type: array
          maxItems: 10
          minItems: 1
          description: Sub-taxes included in the Custom VAT.
        name:
          type: string
          maxLength: 64
          description: Display name of the Custom VAT.
      additionalProperties: false
      type: object
      required:
      - components
      - name
    CustomVatRateResponseList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CustomVatRateResponse'
          type: array
      type: object
      required:
      - data
    CustomVatRateUpdateRequest:
      properties:
        components:
          items:
            $ref: '#/components/schemas/VatRateComponent'
          type: array
          maxItems: 10
          minItems: 1
          description: Sub-taxes included in the Custom VAT.
        name:
          type: string
          maxLength: 64
          description: Display name of the Custom VAT.
      additionalProperties: false
      type: object
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    VatRateComponent:
      properties:
        name:
          type: string
          maxLength: 64
          description: Display name of the Tax.
        value:
          type: number
          maximum: 10000.0
          minimum: 0.0
          description: 'Percent multiplied by a 100. Example: 12.125% is 1212.5. Will be rounded to 2 decimal places'
      additionalProperties: false
      type: object
      required:
      - name
      - value
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

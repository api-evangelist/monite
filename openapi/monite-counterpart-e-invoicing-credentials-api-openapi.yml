        network_identifier:
          type: string
          maxLength: 255
          minLength: 1
        network_schema:
          $ref: '#/components/schemas/EinvoiceSchemaTypeEnum'
      additionalProperties: false
      type: object
      required:
      - network_identifier
      - network_schema
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    CreateCounterpartEinvoicingCredentialCounterpartVatId:
      properties:
        counterpart_vat_id_id:
          type: string
          format: uuid
          description: ID of Counterpart VAT ID
      additionalProperties: false
      type: object
      required:
      - counterpart_vat_id_id
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    CreateCounterpartEinvoicingCredentialPayload:
      anyOf:
      - $ref: '#/components/schemas/CreateCounterpartEinvoicingCredentialCounterpartVatId'
      - $ref: '#/components/schemas/CounterpartEinvoicingCredentialSchema'
      additionalProperties: false
  securitySchemes:

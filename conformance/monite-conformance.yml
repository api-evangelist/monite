- id: ietf-ratelimit-headers
  conforms: partial
  evidence: Responses carry RateLimit-Limit, RateLimit-Remaining, RateLimit-Reset plus X-RateLimit-* and Retry-After on 429. https://docs.monite.com/api/concepts/rate-limiting
- id: peppol

aid: monite

name: Monite

description: Monite (Monite GmbH) is an embedded finance API platform that lets neobanks and B2B SaaS platforms add invoicing, accounts payable
  automation, payments and related financial workflows to their own products, with a fully embeddable SDK and UI components. Its REST API (api.monite.com,
  with a sandbox at api.sandbox.monite.com) is documented at docs.monite.com, and the company publishes a public API style guide with Spectral
  rules on GitHub.


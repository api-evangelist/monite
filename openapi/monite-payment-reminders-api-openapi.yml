components:
  schemas:
    Reminder:
      properties:
        body:
          type: string
        days_before:
          type: integer
          maximum: 10000.0
          minimum: 1.0
        subject:
          type: string
      additionalProperties: false
      type: object
      required:
      - body
      - days_before
      - subject
    PaymentReminderUpdateRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
        recipients:
          $ref: '#/components/schemas/Recipients'
        term_1_reminder:
          allOf:
          - $ref: '#/components/schemas/Reminder'
          description: Reminder to send for first payment term
        term_2_reminder:
          allOf:
          - $ref: '#/components/schemas/Reminder'
          description: Reminder to send for second payment term
        term_final_reminder:
          allOf:
          - $ref: '#/components/schemas/Reminder'
          description: Reminder to send for final payment term
      additionalProperties: false
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    PaymentReminderResponse:
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          description: Time at which the PaymentReminder was created. Timestamps follow the ISO 8601 standard.
        updated_at:
          type: string
          format: date-time
          description: Time at which the PaymentReminder was last updated. Timestamps follow the ISO 8601 standard.
        entity_id:
          type: string
          format: uuid
        name:
          type: string
        recipients:
          $ref: '#/components/schemas/Recipients'
        status:
          $ref: '#/components/schemas/StatusEnum'
        term_1_reminder:
          allOf:
          - $ref: '#/components/schemas/Reminder'
          description: Reminder to send for first payment term
        term_2_reminder:
          allOf:
          - $ref: '#/components/schemas/Reminder'
          description: Reminder to send for second payment term
        term_final_reminder:
          allOf:
          - $ref: '#/components/schemas/Reminder'
          description: Reminder to send for final payment term
      additionalProperties: false
      type: object
      required:
      - id
      - created_at
      - updated_at
      - entity_id
      - name
      - status
    StatusEnum:
      type: string
      enum:
      - active
      - deleted
    Recipients:
      properties:
        bcc:
          items:
            type: string
            format: email
          type: array
        cc:
          items:
            type: string
            format: email
          type: array
        to:
          items:
            type: string
            format: email
          type: array
      additionalProperties: false
      type: object
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    PaymentReminder:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
        recipients:
          $ref: '#/components/schemas/Recipients'
        term_1_reminder:
          allOf:
          - $ref: '#/components/schemas/Reminder'
          description: Reminder to send for first payment term
        term_2_reminder:
          allOf:
          - $ref: '#/components/schemas/Reminder'
          description: Reminder to send for second payment term
        term_final_reminder:
          allOf:
          - $ref: '#/components/schemas/Reminder'
          description: Reminder to send for final payment term
      additionalProperties: false
      type: object
      required:
      - name
    GetAllPaymentReminders:
      properties:
        data:
          items:
            $ref: '#/components/schemas/PaymentReminderResponse'
          type: array
      additionalProperties: false
      type: object
      required:
      - data
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

components:
  schemas:
    ProjectCursorFields:
      type: string
      enum:
      - id
      - created_at
    OrderEnum:
      type: string
      enum:
      - asc
      - desc
    ErrorSchema2:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    TagCategory:
      type: string
      enum:
      - document_type
      - department
      - project
      - cost_center
      - vendor_type
      - payment_method
      - approval_status
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    ProjectUpdateRequest:
      properties:
        code:
          type: string
          maxLength: 20
          minLength: 1
          pattern: ^[a-zA-Z0-9]+$
          description: Project code
        color:
          type: string
          maxLength: 128
          description: Project color
        description:
          type: string
          maxLength: 1024
          description: Description of project
        end_date:
          type: string
          format: date
          description: Project end date
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: The project name.
          example: Marketing
        parent_id:
          type: string
          format: uuid
          description: Parent project ID
        partner_metadata:
          type: object
          description: Project metadata
        start_date:
          type: string
          format: date
          description: Project start date
        tag_ids:
          items:
            type: string
            format: uuid
          type: array
          description: A list of IDs of user-defined tags (labels) assigned to this project.
          default: []
      additionalProperties: false
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    ProjectResource:
      properties:
        id:
          type: string
          format: uuid
          description: A unique ID assigned to this project.
        created_at:
          type: string
          format: date-time
          description: Project created at
        updated_at:
          type: string
          format: date-time
          description: Last time project was updated at
        code:
          type: string
          maxLength: 20
          minLength: 1
          pattern: ^[a-zA-Z0-9]+$
          description: Project code
        color:
          type: string
          maxLength: 128
          description: Project color
        created_by_entity_user_id:
          type: string
          format: uuid
          description: Project created by entity user
        description:
          type: string
          maxLength: 1024
          description: Description of project
        end_date:
          type: string
          format: date
          description: Project end date
        entity_id:
          type: string
          format: uuid
          description: The ID of the entity to which the project was issued.
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: The project name.
          example: Marketing
        parent_id:
          type: string
          format: uuid
          description: Parent project ID
        partner_metadata:
          type: object
          description: Project metadata
        start_date:
          type: string
          format: date
          description: Project start date
        tags:
          items:
            $ref: '#/components/schemas/TagReadSchema'
          type: array
          description: A list of user-defined tags (labels) assigned to this project.
      additionalProperties: false
      type: object
      required:
      - id
      - created_at
      - updated_at
      - entity_id
      - name
    ProjectPaginationResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ProjectResource'
          type: array
        next_pagination_token:
          type: string
          description: A token that can be sent in the `pagination_token` query parameter to get the next page of results, or `null` if there is no next page (i.e. you've reached the last page).
        prev_pagination_token:
          type: string
          description: A token that can be sent in the `pagination_token` query parameter to get the previous page of results, or `null` if there is no previous page (i.e. you've reached the first page).
      type: object
      required:
      - data
      description: A paginated list of projects.
    ErrorSchemaResponse2:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema2'
      type: object
      required:
      - error
    ProjectCreateRequest:
      properties:
        code:
          type: string
          maxLength: 20
          minLength: 1
          pattern: ^[a-zA-Z0-9]+$
          description: Project code
        color:
          type: string
          maxLength: 128
          description: Project color
        description:
          type: string
          maxLength: 1024
          description: Description of project
        end_date:
          type: string
          format: date
          description: Project end date
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: The project name.
          example: Marketing
        parent_id:
          type: string
          format: uuid
          description: Parent project ID
        partner_metadata:
          type: object
          description: Project metadata
        start_date:
          type: string
          format: date
          description: Project start date
        tag_ids:
          items:
            type: string
            format: uuid
          type: array
          description: A list of IDs of user-defined tags (labels) assigned to this project.
          default: []
      additionalProperties: false
      type: object
      required:
      - name
    TagReadSchema:
      properties:
        id:
          type: string
          format: uuid
          description: A unique ID of this tag.
          example: ea837e28-509b-4b6a-a600-d54b6aa0b1f5
        created_at:
          type: string
          format: date-time
          description: Date and time when the tag was created. Timestamps follow the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) standard.
          example: '2022-09-07T16:35:18.484507+00:00'
        updated_at:
          type: string
          format: date-time
          description: Date and time when the tag was last updated. Timestamps follow the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) standard.
          example: '2022-09-07T16:35:18.484507+00:00'
        category:
          allOf:
          - $ref: '#/components/schemas/TagCategory'
          description: The tag category.
          example: department
        created_by_entity_user_id:
          type: string
          format: uuid
          description: ID of the user who created the tag.
          example: ea837e28-509b-4b6a-a600-d54b6aa0b1f5
        description:
          type: string
          maxLength: 255
          minLength: 1
          description: The tag description.
          example: Tag for the Marketing Department
        name:
          type: string
          description: The tag name.
          example: Marketing
      type: object
      required:
      - id
      - created_at
      - updated_at
      - name
      description: Represents a user-defined tag that can be assigned to resources to filter them.
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

components:
  schemas:
    PaymentTermsUpdatePayload:
      properties:
        description:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 100
          minLength: 1
        term_1:
          allOf:
          - $ref: '#/components/schemas/TermDiscountDays'
          description: The first tier of the payment term. Represents the terms of the first early discount.
        term_2:
          allOf:
          - $ref: '#/components/schemas/TermDiscountDays'
          description: The second tier of the payment term. Defines the terms of the second early discount.
        term_final:
          allOf:
          - $ref: '#/components/schemas/TermFinalDays'
          description: The final tier of the payment term. Defines the invoice due date.
      additionalProperties: false
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    PaymentTermsListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/PaymentTermsResponse'
          type: array
      additionalProperties: false
      type: object
    PaymentTermsResponse:
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        name:
          type: string
        term_1:
          allOf:
          - $ref: '#/components/schemas/TermDiscountDays'
          description: The first tier of the payment term. Represents the terms of the first early discount.
        term_2:
          allOf:
          - $ref: '#/components/schemas/TermDiscountDays'
          description: The second tier of the payment term. Defines the terms of the second early discount.
        term_final:
          allOf:
          - $ref: '#/components/schemas/TermFinalDays'
          description: The final tier of the payment term. Defines the invoice due date.
      type: object
      required:
      - id
      - name
      - term_final
    TermFinalDays:
      properties:
        number_of_days:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          description: The amount of days after the invoice issue date.
      additionalProperties: false
      type: object
      required:
      - number_of_days
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    TermDiscountDays:
      properties:
        discount:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          description: The discount percentage in minor units. E.g., 200 means 2%. 1050 means 10.5%.
        number_of_days:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          description: The amount of days after the invoice issue date.
      additionalProperties: false
      type: object
      required:
      - discount
      - number_of_days
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    PaymentTermsCreatePayload:
      properties:
        description:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 100
          minLength: 1
        term_1:
          allOf:
          - $ref: '#/components/schemas/TermDiscountDays'
          description: The first tier of the payment term. Represents the terms of the first early discount.
        term_2:
          allOf:
          - $ref: '#/components/schemas/TermDiscountDays'
          description: The second tier of the payment term. Defines the terms of the second early discount.
        term_final:
          allOf:
          - $ref: '#/components/schemas/TermFinalDays'
          description: The final tier of the payment term. Defines the invoice due date.
      additionalProperties: false
      type: object
      required:
      - name
      - term_final
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

          format: uri
          examples:
          - https://monite.com
        default_state:
          anyOf:
          - type: string
          - type: 'null'
          description: A state each new payable will have upon creation
          examples:
          - new
        enable_line_items:
          type: boolean
          description: Partners can set this to True or False to control line item detection in OCR flows.
          default: true
        skip_approval_for_paid_invoice:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
      type: object
      required:
      - approve_page_url

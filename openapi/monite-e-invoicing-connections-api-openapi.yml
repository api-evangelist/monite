components:
  schemas:
    EinvoicingAddress:
      properties:
        address_line1:
          type: string
          description: Street address line 1
        address_line2:
          type: string
          description: Street address line 2
        city:
          type: string
          description: City name
        country:
          allOf:
          - $ref: '#/components/schemas/AllowedEinvoicingCountryCodes'
          description: Country name
        postal_code:
          type: string
          description: Postal/ZIP code
        state:
          type: string
          description: State/Province/County
      additionalProperties: false
      type: object
      required:
      - address_line1
      - city
      - country
      - postal_code
    EinvoicingConnectionUpdateRequest:
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/UpdateEinvoicingAddress'
          description: Integration Address
        is_receiver:
          type: boolean
          description: Set to `true` if the entity needs to receive e-invoices.
        is_sender:
          type: boolean
          description: Set to `true` if the entity needs to send e-invoices. Either `is_sender` or `is_receiver` or both must be `true`.
      additionalProperties: false
      type: object
    EinvoicingConnectionCreateRequest:
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/EinvoicingAddress'
          description: Integration Address
        entity_vat_id_id:
          type: string
          format: uuid
          description: Entity VAT ID identifier for the integration
        is_receiver:
          type: boolean
          description: Set to `true` if the entity needs to receive e-invoices.
          default: true
        is_sender:
          type: boolean
          description: Set to `true` if the entity needs to send e-invoices. Either `is_sender` or `is_receiver` or both must be `true`.
          default: true
      additionalProperties: false
      type: object
      required:
      - address
    EInvoicingRetrieveListData:
      properties:
        data:
          items:
            $ref: '#/components/schemas/EinvoicingConnectionResponse'
          type: array
          description: List of connections for the current page
      additionalProperties: false
      type: object
      required:
      - data
    UpdateEinvoicingAddress:
      properties:
        address_line1:
          type: string
          description: Street address line 1
        address_line2:
          type: string
          description: Street address line 2
        city:
          type: string
          description: City name
        postal_code:
          type: string
          description: Postal/ZIP code
        state:
          type: string
          description: State/Province/County
      additionalProperties: false
      type: object
      required:
      - address_line1
      - city
      - postal_code
    EinvoicingNetworkCredentialsCreateRequest:
      properties:
        network_credentials_identifier:
          type: string
          description: Network participant identifier
          example: '12345678'
        network_credentials_schema:
          allOf:
          - $ref: '#/components/schemas/EinvoiceSchemaTypeEnum'
          description: Network scheme identifier
          example: NL:KVK
      additionalProperties: false
      type: object
      required:
      - network_credentials_identifier
      - network_credentials_schema
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    AllowedEinvoicingCountryCodes:
      type: string
      enum:
      - DE
      - NL
      - BE
    EinvoiceSchemaTypeEnum:
      type: string
      enum:
      - DE:VAT
      - NL:KVK
      - NL:VAT
      - BE:VAT
      - BE:EN
    EinvoicingNetworkCredentialsResponse:
      properties:
        id:
          type: string
          format: uuid
          description: ID of the credentials
        created_at:
          type: string
          format: date-time
          description: Date of credential
        updated_at:
          type: string
          format: date-time
          description: Last update of credential
        einvoicing_connection_id:
          type: string
          format: uuid
          description: ID of the Einvoicing connection
        network_credentials_identifier:
          type: string
          description: Network participant identifier
          example: '12345678'
        network_credentials_schema:
          allOf:
          - $ref: '#/components/schemas/EinvoiceSchemaTypeEnum'
          description: Network scheme identifier
          example: NL:KVK
      type: object
      required:
      - id
      - created_at
      - updated_at
      - einvoicing_connection_id
      - network_credentials_identifier
      - network_credentials_schema
    EinvoicingConnectionResponse:
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          description: Date of Integration
        updated_at:
          type: string
          format: date-time
          description: Last update of Integration
        address:
          allOf:
          - $ref: '#/components/schemas/EinvoicingAddress'
          description: Integration Address
        credentials:
          items:
            $ref: '#/components/schemas/EinvoicingNetworkCredentialsResponse'
          type: array
          description: List of credentials
        entity_id:
          type: string
          format: uuid
          description: ID of the entity
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        is_receiver:
          type: boolean
          description: Set to `true` if the entity needs to receive e-invoices.
          default: true
        is_sender:
          type: boolean
          description: Set to `true` if the entity needs to send e-invoices. Either `is_sender` or `is_receiver` or both must be `true`.
          default: true
        legal_name:
          type: string
          description: Legal name of the Entity
        provider_id:
          type: string
          description: ID assigned by integration partner
          example: '12345'
        status:
          type: string
          description: Current status of the integration
          example: active
      additionalProperties: false
      type: object
      required:
      - id
      - created_at
      - updated_at
      - address
      - credentials
      - entity_id
      - legal_name
      - status
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

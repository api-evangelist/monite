      - payment_intents
      - payment_method
    SinglePaymentIntent:
      properties:
        object:
          $ref: '#/components/schemas/PaymentObjectPayable'
        payment_reference:
          type: string
          description: Must be provided if payable's document id is missing.
        recipient:
          $ref: '#/components/schemas/PaymentIntentsRecipient'
      additionalProperties: false
      type: object
      required:
      - object
      - recipient
  securitySchemes:

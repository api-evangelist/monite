components:
  schemas:
    DomainRequest:
      properties:
        domain:
          type: string
          format: hostname
          description: The domain name, such as `mail.mycompany.com`. Can contain only alphanumeric characters (A..Z a..z 0..9), dots (.), and hyphens (-). Each segment of the domain name must start and end with either a letter or a digit.
      additionalProperties: false
      type: object
      required:
      - domain
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    DNSRecordPurpose:
      type: string
      enum:
      - DKIM
      - SPF
    DomainResponse:
      properties:
        id:
          type: string
          format: uuid
          description: Entry UUID
        dedicated_ip:
          type: string
          description: A dedicated IP address assigned to this mailbox and used to send outgoing email.
        dns_records:
          anyOf:
          - $ref: '#/components/schemas/DNSRecords'
          - type: object
        domain:
          type: string
          format: hostname
          description: The domain name.
        last_updated_at:
          type: string
          format: date-time
          description: The time the domain was updated for the last time
        status:
          type: string
      type: object
      required:
      - id
      - dns_records
      - domain
      - status
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    DNSRecord:
      properties:
        is_active:
          type: boolean
        name:
          type: string
        record_purpose:
          allOf:
          - $ref: '#/components/schemas/DNSRecordPurpose'
          description: Purpose of specific entry to distinguish between various TXT entries.
        record_type:
          $ref: '#/components/schemas/DNSRecordType'
        valid:
          type: string
          description: Field reflecting validation status by Mailgun.
        value:
          type: string
      type: object
      required:
      - is_active
      - record_type
      - valid
      - value
    DomainListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/DomainResponse'
          type: array
      type: object
      required:
      - data
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    DNSRecords:
      properties:
        receiving_dns_records:
          items:
            $ref: '#/components/schemas/DNSRecord'
          type: array
          description: Set of DNS settings required by Mailgun for domain verification before emails receiving is possible.
        sending_dns_records:
          items:
            $ref: '#/components/schemas/DNSRecord'
          type: array
          description: Set of DNS settings required by Mailgun for domain verification before emails sending is possible.
      type: object
      required:
      - receiving_dns_records
      - sending_dns_records
    DNSRecordType:
      type: string
      enum:
      - TXT
      - MX
      - CNAME
    VerifyResponse:
      properties:
        id:
          type: string
          format: uuid
          description: Entry UUID
        domain:
          type: string
          format: hostname
          description: The domain name.
        status:
          type: string
      type: object
      required:
      - id
      - domain
      - status
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

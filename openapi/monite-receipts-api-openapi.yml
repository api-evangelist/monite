        schema:
          allOf:
          - $ref: '#/components/schemas/OrderEnum'
          default: asc
        name: order
        in: query
      - description: The number of items (0 .. 100) to return in a single page of the response. The response may contain fewer items if it is the last or only page.
        required: false
        schema:
          type: integer
          maximum: 100.0
          minimum: 1.0
          default: 100
        name: limit
        in: query
      - description: 'A pagination token obtained from a previous call to this endpoint. Use it to get the next or previous page of results for your initial query. If `pagination_token` is specified, all other query parameters are ignored and inferred from the initial query.


          If not specified, the first page of results will be returned.'
        required: false
        schema:
          type: string
        name: pagination_token
        in: query
      - description: The field to sort the results by. Typically used together with the `order` parameter.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/ReceiptCursorFields'
        name: sort
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__gt
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__lt
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__gte
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__lte
        in: query
      - required: false
        schema:
          items:
            type: string
            format: uuid
          type: array
        name: id__in
        in: query
      - required: false
        schema:
          $ref: '#/components/schemas/CurrencyEnum'
        name: currency
        in: query
      - required: false
        schema:
          type: string
        name: document_id
        in: query
      - required: false
        schema:
          type: string
        name: document_id__contains
        in: query
      - required: false
        schema:
          type: string
        name: document_id__icontains
        in: query
      - required: false
        schema:
          type: integer
          minimum: 0.0
        name: total_amount__gt
        in: query
      - required: false
        schema:
          type: integer
          minimum: 0.0
        name: total_amount__lt
        in: query
      - required: false
        schema:
          type: integer
          minimum: 0.0
        name: total_amount__gte
        in: query
      - required: false
        schema:
          type: integer
          minimum: 0.0
        name: total_amount__lte
        in: query
      - required: false
        schema:
          type: boolean
        name: has_file
        in: query
      - required: false
        schema:
          type: boolean
        name: has_transaction
        in: query
      - required: false
        schema:
          type: string
          format: uuid
        name: transaction_id
        in: query
      - required: false
        schema:
          items:

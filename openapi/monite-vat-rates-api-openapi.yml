openapi: 3.2.0
info:
  title: Monite VAT rates API
  contact:
    name: Monite team
    url: https://monite.com/about/
    email: developers@monite.com
  termsOfService: https://monite.com/terms
  version: '1.0'
  description: 'Operations tagged VAT rates across 3 of this provider''s published API definitions: monite-openapi-2023-09-01.json, monite-openapi-2024-05-25.json, monite-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.dev.monite.com/v1
  description: Development environment
- url: https://api.sandbox.monite.com/v1
  description: Sandbox environment
- url: https://api.monite.com/v1
  description: Production environment (Europe)
- url: https://us.api.monite.com/v1
  description: Production environment (North America)
- url: https://api.monite.oaknorth.co.uk/v1
  description: Oak POC environment
tags:
- name: VAT rates
paths:
  /vat_rates:
    get:
      tags:
      - VAT rates
      summary: Get VAT rates
      operationId: get_vat_rates
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - required: false
        schema:
          type: string
          format: uuid
        name: counterpart_address_id
        in: query
      - required: false
        schema:
          type: string
          format: uuid
        name: counterpart_id
        in: query
      - required: false
        schema:
          type: string
          format: uuid
        name: counterpart_vat_id_id
        in: query
      - required: false
        schema:
          type: string
          format: uuid
        name: entity_vat_id_id
        in: query
      - required: false
        schema:
          $ref: '#/components/schemas/ProductServiceTypeEnum'
        name: product_type
        in: query
      - description: The ID of the entity that owns the requested resource.
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - 9d2b4c8f-2087-4738-ba91-7359683c49a4
        name: x-monite-entity-id
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VatRateListResponse'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://api.dev.monite.com/v1
      description: Development environment
    - url: https://api.sandbox.monite.com/v1
      description: Sandbox environment
    - url: https://api.monite.com/v1
      description: Production environment (Europe)
    - url: https://us.api.monite.com/v1
      description: Production environment (North America)
    - url: https://api.monite.oaknorth.co.uk/v1
      description: Oak POC environment
components:
  schemas:
    VatRateComponent:
      properties:
        name:
          type: string
          maxLength: 64
          description: Display name of the Tax.
        value:
          type: number
          maximum: 10000.0
          minimum: 0.0
          description: 'Percent multiplied by a 100. Example: 12.125% is 1212.5. Will be rounded to 2 decimal places'
      additionalProperties: false
      type: object
      required:
      - name
      - value
    VatRateResponse:
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the vat rate object.
        created_at:
          type: string
          format: date-time
          description: Date/time when this rate was recorded in the table.
        updated_at:
          type: string
          format: date-time
          description: Date/time when this rate was updated in the table.
        components:
          items:
            $ref: '#/components/schemas/VatRateComponent'
          type: array
          maxItems: 3
          minItems: 1
          description: Sub-taxes included in the VAT.
        country:
          allOf:
          - $ref: '#/components/schemas/AllowedCountries'
          description: Two-letter ISO country code ([ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)).
          example: DE
        created_by:
          allOf:
          - $ref: '#/components/schemas/VatRateCreator'
          description: 'By whom this rate was recorded: monite employee | accounting system.'
          default: monite
          deprecated: true
        status:
          allOf:
          - $ref: '#/components/schemas/VatRateStatusEnum'
          description: 'Status for this vat rate: active | inactive.'
        valid_from:
          type: string
          format: date
          description: Date starting from when this rate can be used.
        valid_until:
          type: string
          format: date
          description: Date when this rate was depreciated, after this date rate cannot be used.
        value:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          description: 'Percent minor units. Example: 12.5% is 1250.'
      type: object
      required:
      - id
      - created_at
      - updated_at
      - country
      - value
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    VatRateListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/VatRateResponse'
          type: array
      additionalProperties: false
      type: object
      required:
      - data
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type

openapi: 3.2.0
info:
  title: Monite Counterparts API
  contact:
    name: Monite team
    url: https://monite.com/about/
    email: developers@monite.com
  termsOfService: https://monite.com/terms
  version: '1.0'
  description: 'Operations tagged Counterparts across 3 of this provider''s published API definitions: monite-openapi-2023-09-01.json, monite-openapi-2024-05-25.json, monite-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.dev.monite.com/v1
  description: Development environment
- url: https://api.sandbox.monite.com/v1
  description: Sandbox environment
- url: https://api.monite.com/v1
  description: Production environment (Europe)
- url: https://us.api.monite.com/v1
  description: Production environment (North America)
- url: https://api.monite.oaknorth.co.uk/v1
  description: Oak POC environment
tags:
- name: Counterparts
paths:
  /counterparts:
    get:
      tags:
      - Counterparts
      summary: Get all counterparts
      operationId: get_counterparts
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - description: The IBAN of the counterpart's bank account.
        required: false
        schema:
          type: string
          maxLength: 34
        name: iban
        in: query
      - description: The bank's sort code.
        required: false
        schema:
          type: string
          maxLength: 100
        example: '123456'
        name: sort_code
        in: query
      - description: The bank account number. Required for US bank accounts to accept ACH payments. US account numbers contain 9 to 12 digits. UK account numbers typically contain 8 digits.
        required: false
        schema:
          type: string
          maxLength: 100
        name: account_number
        in: query
      - description: The tax ID of the counterpart.
        required: false
        schema:
          type: string
          maxLength: 30
        name: tax_id
        in: query
      - description: The VAT ID of the counterpart.
        required: false
        schema:
          type: string
          maxLength: 30
        name: vat_id
        in: query
      - description: A list of counterpart IDs to search through.
        required: false
        schema:
          items:
            type: string
            format: uuid
          type: array
        name: id__in
        in: query
      - description: Sort order (ascending by default). Typically used together with the `sort` parameter.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/OrderEnum'
          default: asc
        name: order
        in: query
      - description: The number of items (0 .. 100) to return in a single page of the response. The response may contain fewer items if it is the last or only page.
        required: false
        schema:
          type: integer
          maximum: 100.0
          minimum: 1.0
          default: 100
        name: limit
        in: query
      - description: 'A pagination token obtained from a previous call to this endpoint. Use it to get the next or previous page of results for your initial query. If `pagination_token` is specified, all other query parameters are ignored and inferred from the initial query.


          If not specified, the first page of results will be returned.'
        required: false
        schema:
          type: string
        name: pagination_token
        in: query
      - description: The field to sort the results by. Typically used together with the `order` parameter.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/CounterpartCursorFields'
        name: sort
        in: query
      - required: false
        schema:
          $ref: '#/components/schemas/CounterpartType'
        name: type
        in: query
      - required: false
        schema:
          type: string
        name: counterpart_name
        in: query
      - required: false
        schema:
          type: string
        name: counterpart_name__iexact
        in: query
      - required: false
        schema:
          type: string
        name: counterpart_name__contains
        in: query
      - required: false
        schema:
          type: string
        name: counterpart_name__icontains
        in: query
      - required: false
        schema:
          type: boolean
        name: is_vendor
        in: query
      - required: false
        schema:
          type: boolean
        name: is_customer
        in: query
      - required: false
        schema:
          type: string
        name: email
        in: query
      - required: false
        schema:
          type: string
        name: email__contains
        in: query
      - required: false
        schema:
          type: string
        name: email__icontains
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__gt
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__lt
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__gte
        in: query
      - required: false
        schema:
          type: string
          format: date-time
        name: created_at__lte
        in: query
      - required: false
        schema:
          type: string
        name: address.country
        in: query
      - required: false
        schema:
          type: string
        name: address.city
        in: query
      - required: false
        schema:
          type: string
        name: address.postal_code
        in: query
      - required: false
        schema:
          type: string
        name: address.state
        in: query
      - required: false
        schema:
          type: string
        name: address.line1
        in: query
      - required: false
        schema:
          type: string
        name: address.line2
        in: query
      - required: false
        schema:
          items:
            type: string
            format: uuid
          type: array
        name: tag_ids__in
        in: query
      - description: The ID of the entity that owns the requested resource.
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - 9d2b4c8f-2087-4738-ba91-7359683c49a4
        name: x-monite-entity-id
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartPaginationResponse'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []

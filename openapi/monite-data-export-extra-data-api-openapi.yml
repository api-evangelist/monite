components:
  schemas:
    OrderEnum:
      type: string
      enum:
      - asc
      - desc
    SupportedFieldNames:
      type: string
      enum:
      - default_account_code
      - default_tax_rate_code
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    ExtraDataUpdateRequest:
      properties:
        field_name:
          $ref: '#/components/schemas/SupportedFieldNames'
        field_value:
          type: string
        object_id:
          type: string
          format: uuid
        object_type:
          type: string
          enum:
          - counterpart
      additionalProperties: false
      type: object
    ExtraDataResource:
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        field_name:
          $ref: '#/components/schemas/SupportedFieldNames'
        field_value:
          type: string
        object_id:
          type: string
          format: uuid
        object_type:
          type: string
          enum:
          - counterpart
      type: object
      required:
      - id
      - created_at
      - updated_at
      - field_name
      - field_value
      - object_id
      - object_type
    ExtraDataCreateRequest:
      properties:
        field_name:
          $ref: '#/components/schemas/SupportedFieldNames'
        field_value:
          type: string
        object_id:
          type: string
          format: uuid
        object_type:
          type: string
          enum:
          - counterpart
      additionalProperties: false
      type: object
      required:
      - field_name
      - field_value
      - object_id
      - object_type
    ExtraDataResourceList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ExtraDataResource'
          type: array
        next_pagination_token:
          type: string
        prev_pagination_token:
          type: string
      type: object
      required:
      - data
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ExportSettingCursorFields:
      type: string
      enum:
      - id
      - created_at
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

components:
  schemas:
    TextTemplateResponse:
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        document_type:
          $ref: '#/components/schemas/TextTemplateDocumentTypeEnum'
        is_default:
          type: boolean
        name:
          type: string
        template:
          type: string
        type:
          $ref: '#/components/schemas/TextTemplateType'
      type: object
      required:
      - id
      - created_at
      - updated_at
      - document_type
      - is_default
      - name
      - template
      - type
    TextTemplateDocumentTypeEnum:
      type: string
      enum:
      - quote
      - invoice
      - credit_note
      - discount_reminder
      - final_reminder
      - payables_purchase_order
      - overdue_reminder
    CreateTextTemplatePayload:
      properties:
        document_type:
          $ref: '#/components/schemas/TextTemplateDocumentTypeEnum'
        name:
          type: string
        template:
          type: string
        type:
          $ref: '#/components/schemas/TextTemplateType'
      additionalProperties: false
      type: object
      required:
      - document_type
      - name
      - template
      - type
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    TextTemplateResponseList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TextTemplateResponse'
          type: array
        next_pagination_token:
          type: string
        prev_pagination_token:
          type: string
      type: object
      required:
      - data
    UpdateTextTemplatePayload:
      properties:
        name:
          type: string
        template:
          type: string
      additionalProperties: false
      type: object
    TextTemplateType:
      type: string
      enum:
      - email_header
      - email_body
      - memo
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
x-refined-from:
- monite-openapi-2023-09-01.json
- monite-openapi-2024-05-25.json

      summary: Delete
      description: Delete custom template bt ID
      operationId: delete_mail_templates_id
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - required: true
        schema:
          type: string
          format: uuid
        name: template_id
        in: path
      responses:
        '204':
          description: Successful Response
        '405':
          description: Method Not Allowed

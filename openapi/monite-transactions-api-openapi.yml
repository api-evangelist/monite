openapi: 3.2.0
info:
  title: Monite Transactions API
  contact:
    name: Monite team
    url: https://monite.com/about/
    email: developers@monite.com
  termsOfService: https://monite.com/terms
  version: '1.0'
  description: 'Operations tagged Transactions across 2 of this provider''s published API definitions: monite-openapi-2023-09-01.json, monite-openapi-2024-05-25.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.dev.monite.com/v1
  description: Development environment
- url: https://api.sandbox.monite.com/v1
  description: Sandbox environment
- url: https://api.monite.com/v1
  description: Production environment (Europe)
- url: https://us.api.monite.com/v1
  description: Production environment (North America)
- url: https://api.monite.oaknorth.co.uk/v1
  description: Oak POC environment
tags:
- name: Transactions
paths:
  /transactions:
    get:
      tags:
      - Transactions
      summary: Get transactions
      operationId: get_transactions
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - description: Order by
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/OrderEnum'
          default: asc
        name: order
        in: query
      - description: Max is 100
        required: false
        schema:
          type: integer
          maximum: 100.0
          minimum: 1.0
          default: 100
        name: limit
        in: query
      - description: A token, obtained from previous page. Prior over other filters
        required: false
        schema:
          type: string
        name: pagination_token
        in: query
      - description: Allowed sort fields
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/TransactionCursorFields'
        name: sort
        in: query
      - description: Created after this datetime (exclusive)
        required: false
        schema:
          type: string
          format: date-time
        name: created_at__gt
        in: query
      - description: Created before this datetime (exclusive)
        required: false
        schema:
          type: string
          format: date-time
        name: created_at__lt
        in: query
      - description: Updated after this datetime (exclusive)
        required: false
        schema:
          type: string
          format: date-time
        name: updated_at__gt
        in: query
      - description: Updated before this datetime (exclusive)
        required: false
        schema:
          type: string
          format: date-time
        name: updated_at__lt
        in: query
      - description: Transaction started after this datetime (exclusive)
        required: false
        schema:
          type: string
          format: date-time
        name: started_at__gt
        in: query
      - description: Transaction started before this datetime (exclusive)
        required: false
        schema:
          type: string
          format: date-time
        name: started_at__lt
        in: query
      - description: One or multiple of the transaction statuses
        required: false
        schema:
          items:
            $ref: '#/components/schemas/TransactionStatusEnum'
          type: array
        name: status__in
        in: query
      - description: One or multiple of the transaction types
        required: false
        schema:
          items:
            $ref: '#/components/schemas/TransactionTypeEnum'
          type: array
        name: type__in
        in: query
      - description: One or multiple of the entity users
        required: false
        schema:
          items:
            type: string
            format: uuid
          type: array
        name: entity_user_id__in
        in: query
      - description: One or multiple of the transaction external ids
        required: false
        schema:
          items:
            type: string
          type: array
        name: external_id__in
        in: query
      - description: Amount greater than (exclusive)
        required: false
        schema:
          type: integer
        name: amount__gt
        in: query
      - description: Amount less than (exclusive)
        required: false
        schema:
          type: integer
        name: amount__lt
        in: query
      - description: One or multiple of the transaction currencies
        required: false
        schema:
          items:
            $ref: '#/components/schemas/CurrencyEnum'
          type: array
        name: currency__in
        in: query
      - description: Merchant amount greater than (exclusive)
        required: false
        schema:
          type: integer
        name: merchant_amount__gt
        in: query
      - description: Merchant amount less than (exclusive)
        required: false
        schema:
          type: integer
        name: merchant_amount__lt
        in: query
      - description: One or multiple of the transaction merchant currencies
        required: false
        schema:
          items:
            $ref: '#/components/schemas/CurrencyEnum'
          type: array
        name: merchant_currency__in
        in: query
      - description: Partially matched merchant name
        required: false
        schema:
          type: string
        name: merchant_name__icontains
        in: query
      - description: Payment method type of the transaction
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/TransactionPaymentMethodTypeEnum'
        name: payment_method
        in: query
      - description: One or multiple of the payment method types
        required: false
        schema:
          items:
            $ref: '#/components/schemas/TransactionPaymentMethodTypeEnum'
          type: array
        name: payment_method__in
        in: query
      - description: The ID of the entity that owns the requested resource.
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - 9d2b4c8f-2087-4738-ba91-7359683c49a4
        name: x-monite-entity-id
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponseList'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Transactions
      summary: Create a transaction
      operationId: post_transactions
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - description: The ID of the entity that owns the requested resource.
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - 9d2b4c8f-2087-4738-ba91-7359683c49a4
        name: x-monite-entity-id
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://api.dev.monite.com/v1
      description: Development environment
    - url: https://api.sandbox.monite.com/v1
      description: Sandbox environment
    - url: https://api.monite.com/v1
      description: Production environment (Europe)
    - url: https://us.api.monite.com/v1
      description: Production environment (North America)
    - url: https://api.monite.oaknorth.co.uk/v1
      description: Oak POC environment
  /transactions/bulk:
    post:
      tags:
      - Transactions
      summary: Create multiple transactions
      operationId: post_transactions_bulk
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - description: The ID of the entity that owns the requested resource.
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - 9d2b4c8f-2087-4738-ba91-7359683c49a4
        name: x-monite-entity-id
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionBulkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBulkResponse'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://api.dev.monite.com/v1
      description: Development environment
    - url: https://api.sandbox.monite.com/v1
      description: Sandbox environment
    - url: https://api.monite.com/v1
      description: Production environment (Europe)
    - url: https://us.api.monite.com/v1
      description: Production environment (North America)
    - url: https://api.monite.oaknorth.co.uk/v1
      description: Oak POC environment
  /transactions/{transaction_id}:
    get:
      tags:
      - Transactions
      summary: Get a transaction
      operationId: get_transactions_id
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - required: true
        schema:
          type: string
          format: uuid
        name: transaction_id
        in: path
      - description: The ID of the entity that owns the requested resource.
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - 9d2b4c8f-2087-4738-ba91-7359683c49a4
        name: x-monite-entity-id
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - Transactions
      summary: Update a transaction
      operationId: patch_transactions_id
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - required: true
        schema:
          type: string
          format: uuid
        name: transaction_id
        in: path
      - description: The ID of the entity that owns the requested resource.
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - 9d2b4c8f-2087-4738-ba91-7359683c49a4
        name: x-monite-entity-id
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '409':
          description: Business logic error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - Transactions
      summary: Delete a transaction
      operationId: delete_transactions_id
      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - required: true
        schema:
          type: string
          format: uuid
        name: transaction_id
        in: path
      - description: The ID of the entity that owns the requested resource.
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - 9d2b4c8f-2087-4738-ba91-7359683c49a4
        name: x-monite-entity-id
        in: header
      responses:
        '204':
          description: Successful Response
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://api.dev.monite.com/v1
      description: Development environment
    - url: https://api.sandbox.monite.com/v1
      description: Sandbox environment
    - url: https://api.monite.com/v1
      description: Production environment (Europe)
    - url: https://us.api.monite.com/v1
      description: Production environment (North America)
    - url: https://api.monite.oaknorth.co.uk/v1
      description: Oak POC environment
components:
  schemas:
    TransactionStatusEnum:
      type: string
      enum:
      - created
      - processing
      - succeeded
      - declined
      - refunded
      - failed
    TransactionTypeEnum:
      type: string
      enum:
      - capture
      - refund
      - cash_withdrawal
      - fee
      - adjustment
      - reversal
    CardPaymentMethodDetails:
      properties:
        brand:
          type: string
          maxLength: 32
          description: The card brand name.
        card_type:
          allOf:
          - $ref: '#/components/schemas/CardTypeEnum'
          description: The card type
        expiry_month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          description: The card's expiration month (1 - January, 12 - December).
        expiry_year:
          type: integer
          maximum: 2099.0
          exclusiveMinimum: 2001.0
          description: The card's expiration year.
        last4:
          type: string
          maxLength: 4
          minLength: 4
          description: The last four digits of the card number.
          examples:
          - 1234
      type: object
      required:
      - brand
      - card_type
      - expiry_month
      - expiry_year
      - last4
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    TransactionResponse:
      properties:
        id:
          type: string
          format: uuid
          description: A unique Monite-generated ID assigned to this transaction.
        amount:
          type: integer
          description: The transaction amount in [minor units](https://docs.monite.com/references/currencies#minor-units). Positive values for in-flow, negative values for out-flow.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: ISO currency code.
          examples:
          - EUR
        description:
          type: string
          maxLength: 255
          description: A human-readable description of the transaction.
        entity_id:
          type: string
          format: uuid
          description: ID of the entity that owns this resource.
        entity_user_id:
          type: string
          format: uuid
          description: ID of the entity user who made the transaction, if applicable.
        external_id:
          type: string
          maxLength: 128
          description: External identifier for idempotency, if provided by the source system.
        merchant_amount:
          type: integer
          description: Original merchant transaction amount in minor units.
        merchant_currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: ISO currency code for the `merchant_amount`.
        merchant_location:
          type: string
          maxLength: 128
          description: The merchant location.
          examples:
          - Berlin, Germany
        merchant_name:
          type: string
          maxLength: 128
          description: The merchant name.
          examples:
          - Acme Inc.
        partner_metadata:
          additionalProperties:
            type: string
          type: object
          description: Extensible key-value pairs for storing additional custom information for partner needs.
        payment_method:
          $ref: '#/components/schemas/TransactionPaymentMethod'
        receipt_id:
          type: string
          description: ID of the related receipt from payables service, if any. This field is read-only and system-managed.
        started_at:
          type: string
          format: date-time
          description: Date and time when the transaction was initiated.
        status:
          allOf:
          - $ref: '#/components/schemas/TransactionStatusEnum'
          description: The current processing status of the transaction.
          default: created
        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          description: The nature of the transaction.
      type: object
      required:
      - id
      - amount
      - currency
      - entity_id
      - merchant_amount
      - merchant_currency
      - merchant_location
      - merchant_name
      - payment_method
      - started_at
      - type
    TransactionRequest:
      properties:
        amount:
          type: integer
          description: The transaction amount in [minor units](https://docs.monite.com/references/currencies#minor-units). Positive values for in-flow, negative values for out-flow.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: ISO currency code.
          examples:
          - EUR
        description:
          type: string
          maxLength: 255
          description: A human-readable description of the transaction.
        entity_user_id:
          type: string
          format: uuid
          description: ID of the entity user who made the transaction, if applicable.
        external_id:
          type: string
          maxLength: 128
          description: External identifier for idempotency, if provided by the source system.
        merchant_amount:
          type: integer
          description: Original merchant transaction amount in minor units.
        merchant_currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: ISO currency code for the `merchant_amount`.
        merchant_location:
          type: string
          maxLength: 128
          description: The merchant location.
          examples:
          - Berlin, Germany
        merchant_name:
          type: string
          maxLength: 128
          description: The merchant name.
          examples:
          - Acme Inc.
        partner_metadata:
          additionalProperties:
            type: string
          type: object
          description: Extensible key-value pairs for storing additional custom information for partner needs.
        payment_method:
          $ref: '#/components/schemas/TransactionPaymentMethod'
        started_at:
          type: string
          format: date-time
          description: Date and time when the transaction was initiated.
        status:
          allOf:
          - $ref: '#/components/schemas/TransactionStatusEnum'
          description: The current processing status of the transaction.
          default: created
        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          description: The nature of the transaction.
      type: object
      required:
      - amount
      - currency
      - merchant_amount
      - merchant_currency
      - merchant_location
      - merchant_name
      - payment_method
      - type
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    BankAccountPaymentMethod:
      properties:
        details:
          $ref: '#/components/schemas/BankAccountPaymentMethodDetails'
        type:
          type: string
          enum:
          - bank_account
      type: object
      required:
      - details
      - type
    BankAccountPaymentMethodDetails:
      properties:
        account_holder_name:
          type: string
          description: The name of the person or business that owns this bank account.
          examples:
          - Bob Jones
        account_number:
          type: string
          description: The bank account number. US account numbers contain 9 to 12 digits. UK account numbers typically contain 8 digits.
          examples:
          - '12345678'
        bic:
          type: string
          maxLength: 11
          description: The SWIFT/BIC code of the bank. Can be either 8 or 11 characters long.
          examples:
          - DEUTDEFFXXX
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: ISO currency code of the bank account.
        iban:
          type: string
          maxLength: 34
          description: The IBAN of the bank account, up to 34 characters.
          examples:
          - DE74500700100100000900
        name:
          type: string
          maxLength: 200
          description: The name of the bank account, if available. For example, "Primary account" or "Savings account".
        routing_number:
          type: string
          description: The bank's routing transit number (RTN). US routing numbers consist of 9 digits.
        sort_code:
          type: string
          description: The bank's sort code.
          examples:
          - '123456'
      type: object
    CardTypeEnum:
      type: string
      enum:
      - credit
      - debit
      - prepaid
      - unknown
    TransactionCursorFields:
      type: string
      enum:
      - created_at
      - updated_at
      - started_at
      - amount

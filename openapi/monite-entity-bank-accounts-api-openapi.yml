      parameters:
      - required: true
        schema:
          type: string
          format: date
        example: '2023-09-01'
        name: x-monite-version
        in: header
      - required: true
        schema:
          type: string
          format: uuid
        name: bank_account_id
        in: path
      - description: The ID of the entity that owns the requested resource.
        required: true

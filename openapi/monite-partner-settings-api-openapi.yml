        support_email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          description: The support email address
      type: object
    CurrencySettings-Input:
      properties:
        default:
          $ref: '#/components/schemas/CurrencyEnum'
        exchange_rates:
          items:
            anyOf:
            - $ref: '#/components/schemas/ExchangeRate'
            - type: 'null'
          type: array
      additionalProperties: false
      type: object
      required:
      - default
    ButtonTheme-Input:

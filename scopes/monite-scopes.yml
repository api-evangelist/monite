docs: https://docs.monite.com/api/concepts/authentication#permissions
note: Monite does not use OAuth scope strings; access for entity-user tokens is governed by RBAC role permissions, each an object_type with action names, granted as not_allowed (default), allowed, or allowed_for_own.
  Partner tokens (client_credentials) bypass entity RBAC.
permission_types:

  termsOfService: https://monite.com/terms
  version: '1.0'
  description: 'Operations tagged Counterpart bank accounts across 2 of this provider''s published API definitions: monite-openapi-2023-09-01.json, monite-openapi-2024-05-25.json. Each path carries the servers of the definition it was published in.'

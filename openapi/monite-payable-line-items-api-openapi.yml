      - HTTPBearer: []
    put:
      tags:
      - Payable line items
      summary: Replaces the lines items in a payable
      description: 'Replaces the information of all line items of a specific payable.


        Related guide: Replace all line items


        See also:


        Manage line items


        Collect payables'
      operationId: put_payables_id_line_items
      parameters:

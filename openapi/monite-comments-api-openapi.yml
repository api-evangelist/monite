    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    CommentUpdateRequest:
      properties:
        reply_to_entity_user_id:
          type: string
          format: uuid
        text:
          type: string
      additionalProperties: false
      type: object
    ObjectTypeAvailableComment:
      enum:

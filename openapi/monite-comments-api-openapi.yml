components:
  schemas:
    OrderEnum:
      type: string
      enum:
      - asc
      - desc
    StatusEnum:
      type: string
      enum:
      - active
      - deleted
    CommentCreateRequest:
      properties:
        object_id:
          type: string
          format: uuid
        object_type:
          type: string
        reply_to_entity_user_id:
          type: string
          format: uuid
        text:
          type: string
      additionalProperties: false
      type: object
      required:
      - object_id
      - object_type
      - text
    CommentResource:
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_entity_user_id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        object_id:
          type: string
          format: uuid
        object_type:
          type: string
        reply_to_entity_user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/StatusEnum'
        text:
          type: string
      type: object
      required:
      - id
      - created_by_entity_user_id
      - entity_id
      - object_id
      - object_type
      - status
      - text
    CommentCursorFields:

          type: array
      additionalProperties: false
      type: object
      required:
      - data
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    UpdateCounterpartEinvoicingCredentialSchema:
      properties:
        network_identifier:
          type: string
          maxLength: 255
          minLength: 1
        network_schema:
          $ref: '#/components/schemas/EinvoiceSchemaTypeEnum'
      additionalProperties: false
      type: object
    EinvoiceSchemaTypeEnum:
      type: string
      enum:
      - DE:VAT
      - NL:KVK
      - NL:VAT
      - BE:VAT
      - BE:EN
    CounterpartEinvoicingCredentialResponse:
      properties:
        id:
          type: string
          format: uuid
        network_identifier:
          type: string
          maxLength: 255
          minLength: 1
        network_schema:

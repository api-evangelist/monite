        action:
          type: string
        api_version:
          anyOf:
          - type: string
          - type: 'null'
        description:
          type: string
        entity_id:
          type: string
          format: uuid
        object:
          anyOf:
          - {}
          - type: 'null'
        object_type:
          $ref: '#/components/schemas/WebhookObjectType'
      type: object
      required:
      - id
      - action
      - api_version
      - description
      - entity_id
      - object_type
    EventResource_3:
      properties:
        id:
          type: string
          format: uuid
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: The timestamp that was generated at the time of making the database transaction that has initially caused the event
        action:

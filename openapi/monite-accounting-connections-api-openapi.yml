components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    AccountingConnectionList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AccountingConnectionResponse'
          type: array
      type: object
      required:
      - data
    BusinessInfoSchema:
      properties:
        base_currency:
          type: string
        email:
          type: string
        legal_name:
          type: string
        name:
          type: string
        type:
          type: string
      type: object
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    AccountingMessageResponse:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    AccountingConnectionResponse:
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        business_info:
          $ref: '#/components/schemas/BusinessInfoSchema'
        connection_url:
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ErrorSchema'
          type: array
        last_pull:
          type: string
          format: date-time
        platform:
          type: string
        status:
          $ref: '#/components/schemas/ConnectionStatus'
      type: object
      required:
      - id
      - created_at
      - updated_at
      - connection_url
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    ConnectionStatus:
      type: string
      enum:
      - connected
      - disconnected
      - deauthorized
      - pending_auth
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
x-refined-from:
- monite-openapi-2023-09-01.json
- monite-openapi-2024-05-25.json

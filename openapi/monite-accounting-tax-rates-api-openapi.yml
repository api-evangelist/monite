components:
  schemas:
    OrderEnum:
      type: string
      enum:
      - asc
      - desc
    AccountingTaxRateCreateRequest:
      properties:
        code:
          type: string
          maxLength: 500
          description: Code for the tax rate from the accounting platform
        description:
          type: string
          maxLength: 2048
          description: Description of the tax rate
        effective_tax_rate:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          description: 'Effective tax rate in percent [minor units](https://docs.monite.com/references/currencies#minor-units). Example: 12.5% is 1250.'
        name:
          type: string
          maxLength: 500
          description: Name of the tax rate
      type: object
      description: Schema for creating a new tax rate.
    AccountingTaxRateUpdateRequest:
      properties:
        code:
          type: string
          maxLength: 500
          description: Code for the tax rate from the accounting platform
        description:
          type: string
          maxLength: 2048
          description: Description of the tax rate
        effective_tax_rate:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          description: 'Effective tax rate in percent [minor units](https://docs.monite.com/references/currencies#minor-units). Example: 12.5% is 1250.'
        name:
          type: string
          maxLength: 500
          description: Name of the tax rate
      type: object
      description: Schema for updating an existing tax rate.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
      type: object
      required:
      - loc
      - msg
      - type
    AccountingTaxRateListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AccountingTaxRateResponse'
          type: array
        next_pagination_token:
          type: string
        prev_pagination_token:
          type: string
      type: object
      required:
      - data
    AccountingTaxRateResponse:
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          description: The timestamp when the tax rate was created.
        updated_at:
          type: string
          format: date-time
          description: The timestamp when the tax rate was last updated.
        code:
          type: string
          description: Code for the tax rate from the accounting platform.
        components:
          items:
            $ref: '#/components/schemas/TaxComponentResponse'
          type: array
        description:
          type: string
          description: Description of the tax rate
        effective_tax_rate:
          type: integer
          description: 'Effective tax rate in percent [minor units](https://docs.monite.com/references/currencies#minor-units). Example: 12.5% is 1250.'
        is_external:
          type: boolean
          description: Whether the tax rate is from an external system
          default: false
        name:
          type: string
        status:
          type: string
        total_tax_rate:
          type: integer
          description: 'Total (not compounded) sum of the components of a tax rate in [minor units](https://docs.monite.com/references/currencies#minor-units). Example: 12.5% is 1250.'
      type: object
      required:
      - id
      - created_at
      - updated_at
    ErrorSchemaResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      type: object
      required:
      - error
    ErrorSchema:
      properties:
        message:
          type: string
      type: object
      required:
      - message
    TaxComponentResponse:
      properties:
        is_compound:
          type: boolean
          description: A flag to indicate with the tax is calculated using the principle of compounding.
        name:
          type: string
        rate:
          type: integer
          description: 'Component tax rate in percent [minor units](https://docs.monite.com/references/currencies#minor-units). Example: 12.5% is 1250.'
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
    TaxRateAccountCursorFields2:
      type: string
      enum:
      - name
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

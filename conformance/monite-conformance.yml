  evidence: '"This method is in line with, and compliant with OAuth 2.0" - POST /auth/token supports the standard client_credentials grant plus a custom entity_user grant; the contract declares an http bearer scheme, not an oauth2 securityScheme. https://docs.monite.com/api/concepts/authentication'
- id: rfc9457
  conforms: false
  evidence: 'Error bodies use {"error": {"type", "message"}} and {"detail": [...]} JSON envelopes, not application/problem+json (openapi/monite-openapi.yml ErrorSchemaResponse, HTTPValidationError).'
- id: idempotency
